<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Report — AI Interviewer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>📊 Interview Report</h1>
      <a href="/" class="admin-link">← Back Home</a>
    </header>

    <div id="overall-card">
      <div>
        <span style="font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Grade</span>
        <span id="overall-grade">—</span>
      </div>
      <div>
        <span style="font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Overall Score</span>
        <span id="overall-score">—</span>
      </div>
      <div>
        <span style="font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Est. Cost</span>
        <span id="total-cost">—</span>
      </div>
    </div>

    <section id="narrative-section">
      <h2>📝 Assessment Summary</h2>
      <p id="narrative" style="color: var(--text-secondary); line-height: 1.8;">Loading report...</p>
    </section>

    <section id="strengths-section">
      <h2>✨ Strengths</h2>
      <ul id="strengths-list">
        <li style="color: var(--text-muted);">Loading...</li>
      </ul>
    </section>

    <section id="gaps-section">
      <h2>🎯 Areas for Improvement</h2>
      <ul id="gaps-list">
        <li style="color: var(--text-muted);">Loading...</li>
      </ul>
    </section>

    <section id="topics-section">
      <h2>📈 Topic Breakdown</h2>
      <div id="topics-grid"></div>
    </section>
  </div>

  <script>
    const sessionId = "{{ session_id }}";

    function formatUsd(cost) {
      const value = Number(cost) || 0;
      if (value === 0) return "$0.00";
      if (value < 0.01) return `$${value.toFixed(6)}`;
      return `$${value.toFixed(2)}`;
    }

    async function readErrorDetail(res) {
      try {
        const payload = await res.json();
        if (payload && typeof payload.detail === "string" && payload.detail.trim()) {
          return payload.detail;
        }
      } catch (_) {
        // Ignore JSON parse errors and use a fallback message.
      }
      return "Unknown error";
    }

    async function loadReport() {
      if (!sessionId || sessionId === "null" || sessionId === "undefined") {
        document.getElementById("narrative").innerHTML =
          "Invalid report link (missing session ID). Please go back home and start or resume an interview.";
        document.getElementById("strengths-list").innerHTML =
          "<li style='color: var(--text-muted);'>No report data available for this link.</li>";
        document.getElementById("gaps-list").innerHTML =
          "<li style='color: var(--text-muted);'>No report data available for this link.</li>";
        document.getElementById("topics-grid").innerHTML =
          "<p style='grid-column: 1/-1; color: var(--text-muted);'>No topic data available.</p>";
        return;
      }

      // Try to generate on first load if possible. Existing reports are returned as-is.
      const generateRes = await fetch(`/reports/generate/${sessionId}`, { method: "POST" }).catch(() => null);
      if (generateRes && !generateRes.ok && generateRes.status !== 400) {
        const detail = await readErrorDetail(generateRes);
        document.getElementById("narrative").textContent = `Report generation failed: ${detail}`;
      }

      const res = await fetch(`/reports/${sessionId}`);
      if (!res.ok) {
        const detail = await readErrorDetail(res);
        document.getElementById("narrative").textContent = `Report not available yet. ${detail}`;
        return;
      }
      const r = await res.json();
      document.getElementById("overall-grade").textContent = r.overall_grade || "—";
      document.getElementById("overall-score").textContent = `${Math.round(r.overall_score * 100)}%`;
      document.getElementById("total-cost").textContent = formatUsd(r.total_cost_usd);
      document.getElementById("narrative").textContent = r.narrative;
      document.getElementById("strengths-list").innerHTML =
        r.strengths && r.strengths.length > 0 
          ? r.strengths.map(s => `<li>${s}</li>`).join("")
          : "<li style='color: var(--text-muted);'>No strengths data available.</li>";
      document.getElementById("gaps-list").innerHTML =
        r.gaps && r.gaps.length > 0
          ? r.gaps.map(g => `<li>${g}</li>`).join("")
          : "<li style='color: var(--text-muted);'>No improvement areas identified.</li>";
      document.getElementById("topics-grid").innerHTML = 
        r.topic_breakdown && r.topic_breakdown.length > 0
          ? r.topic_breakdown.map(t =>
              `<div class="topic-card">
                <strong>${t.topic_label || 'Unknown'}</strong>
                <span>${Math.round(t.avg_score * 100)}%</span>
                <small>${t.grade || '—'} • ${t.num_questions || 0} question(s)</small>
              </div>`
            ).join("")
          : "<p style='grid-column: 1/-1; color: var(--text-muted);'>No topic data available.</p>";
    }

    loadReport();
  </script>
</body>
</html>
