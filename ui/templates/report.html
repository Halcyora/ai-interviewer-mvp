<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Report</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Interview Report</h1>
    </header>

    <div id="overall-card">
      <span id="overall-grade"></span>
      <span id="overall-score"></span>
      <span id="total-cost"></span>
    </div>

    <section id="narrative-section">
      <h2>Assessment</h2>
      <p id="narrative"></p>
    </section>

    <section id="strengths-section">
      <h2>Strengths</h2>
      <ul id="strengths-list"></ul>
    </section>

    <section id="gaps-section">
      <h2>Areas for Improvement</h2>
      <ul id="gaps-list"></ul>
    </section>

    <section id="topics-section">
      <h2>Topic Breakdown</h2>
      <div id="topics-grid"></div>
    </section>
  </div>

  <script>
    const sessionId = "{{ session_id }}";

    async function loadReport() {
      // Trigger generation if not done yet; ignore 400 if already generated
      await fetch(`/reports/generate/${sessionId}`, { method: "POST" }).catch(() => {});
      const res = await fetch(`/reports/${sessionId}`);
      if (!res.ok) {
        document.getElementById("narrative").textContent = "Report not available yet.";
        return;
      }
      const r = await res.json();
      document.getElementById("overall-grade").textContent = `Grade: ${r.overall_grade}`;
      document.getElementById("overall-score").textContent = `Score: ${Math.round(r.overall_score * 100)}%`;
      document.getElementById("total-cost").textContent = `Est. cost: $${r.total_cost_usd}`;
      document.getElementById("narrative").textContent = r.narrative;
      document.getElementById("strengths-list").innerHTML =
        r.strengths.map(s => `<li>${s}</li>`).join("");
      document.getElementById("gaps-list").innerHTML =
        r.gaps.map(g => `<li>${g}</li>`).join("");
      document.getElementById("topics-grid").innerHTML = r.topic_breakdown.map(t =>
        `<div class="topic-card">
          <strong>${t.topic_label}</strong>
          <span>${Math.round(t.avg_score * 100)}% (${t.grade})</span>
          <small>${t.num_questions} question(s)</small>
        </div>`
      ).join("");
    }

    loadReport();
  </script>
</body>
</html>
